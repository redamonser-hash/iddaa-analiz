<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İddaa Analiz Botu 26/27</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07111f;
  color:#fff;
}
.container{
  max-width:900px;
  margin:auto;
  padding:14px;
}
h1{
  text-align:center;
  margin:10px 0 4px;
  font-size:25px;
}
.subtitle{
  text-align:center;
  color:#9fb0c5;
  margin-bottom:18px;
}
.card{
  background:#101d2d;
  border:1px solid #22344b;
  border-radius:14px;
  padding:15px;
  margin-bottom:14px;
}
label{
  display:block;
  margin:9px 0 5px;
  color:#b9c8d8;
  font-size:14px;
}
select,input,button{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #344a63;
  background:#0b1726;
  color:white;
  font-size:15px;
}
button{
  background:#1976d2;
  border:0;
  font-weight:bold;
  margin-top:10px;
}
button:active{transform:scale(.99)}
button.green{background:#159447}
button.orange{background:#c87800}
button.gray{background:#33465d}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
@media(max-width:600px){
  .row{grid-template-columns:1fr}
}
.status{
  padding:10px;
  border-radius:9px;
  background:#0b1726;
  margin-top:10px;
  color:#aebfd1;
  font-size:14px;
}
.success{color:#58df8b}
.error{color:#ff7272}
.warning{color:#ffc65c}

.match{
  background:#0b1726;
  border:1px solid #263b53;
  border-radius:12px;
  padding:12px;
  margin-top:9px;
}
.match button{
  margin-top:8px;
  background:#263f5b;
}
.team{
  font-weight:bold;
  font-size:16px;
}
.small{
  color:#91a5bb;
  font-size:12px;
}
.score{
  font-size:13px;
  color:#80c7ff;
}
.section-title{
  font-size:18px;
  margin-bottom:10px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}
.stat{
  background:#0b1726;
  border:1px solid #263b53;
  border-radius:10px;
  padding:12px;
}
.stat .name{
  color:#91a5bb;
  font-size:12px;
}
.stat .value{
  font-size:20px;
  font-weight:bold;
  margin-top:4px;
}
.big{
  font-size:28px;
  font-weight:bold;
}
.prob{
  display:flex;
  gap:7px;
  margin-top:10px;
}
.prob div{
  flex:1;
  text-align:center;
  background:#0b1726;
  border-radius:9px;
  padding:10px 5px;
}
.prob b{
  display:block;
  font-size:20px;
}
.hidden{display:none}
.logo{
  width:35px;
  height:35px;
  object-fit:contain;
  vertical-align:middle;
  margin-right:7px;
}
hr{
  border:0;
  border-top:1px solid #263b53;
  margin:15px 0;
}
</style>
</head>

<body>

<div class="container">

<h1>⚽ İDDAA ANALİZ BOTU 26/27</h1>
<div class="subtitle">API-Football gerçek verileriyle analiz</div>

<!-- API AYARLARI -->
<div class="card">
  <div class="section-title">⚙️ API Ayarları</div>

  <label>API-Football Anahtarı</label>
  <input id="apiKey" type="password" placeholder="API anahtarını buraya gir">

  <button onclick="saveKey()" class="green">🔐 Anahtarı Kaydet</button>
  <button onclick="testApi()" class="gray">🧪 API'yi Test Et</button>

  <div id="apiStatus" class="status">
    API anahtarını girip kaydet.
  </div>

  <div class="small" style="margin-top:9px">
    Anahtar yalnızca bu tarayıcıda saklanır. GitHub koduna yazılmaz.
  </div>
</div>

<!-- SEÇİM -->
<div class="card">

<div class="section-title">🎯 Maç Seçimi</div>

<label>Lig</label>
<select id="league" onchange="leagueChanged()">
  <option value="203">🇹🇷 Süper Lig</option>
  <option value="204">🇹🇷 1. Lig</option>
  <option value="39">🏴 Premier League</option>
  <option value="140">🇪🇸 La Liga</option>
  <option value="135">🇮🇹 Serie A</option>
  <option value="78">🇩🇪 Bundesliga</option>
  <option value="61">🇫🇷 Ligue 1</option>
</select>

<label>Sezon</label>
<select id="season">
  <option value="2026">2026/27</option>
</select>

<label>Tarih</label>
<input type="date" id="matchDate">

<button onclick="loadMatches()" class="green">
  📅 Gerçek Maçları Getir
</button>

<div id="matchStatus" class="status">
  Tarih seçip maçları getir.
</div>

<div id="matches"></div>

</div>

<!-- TAKIMLAR -->
<div class="card">

<div class="section-title">👥 Takımlar</div>

<div class="row">

<div>
<label>Ev Sahibi</label>
<select id="homeTeam">
<option value="">Önce lig verisini yükle</option>
</select>
</div>

<div>
<label>Deplasman</label>
<select id="awayTeam">
<option value="">Önce lig verisini yükle</option>
</select>
</div>

</div>

<button onclick="loadTeams()" class="gray">
  🔄 Ligdeki Takımları Getir
</button>

</div>

<!-- ANALİZ -->
<div class="card">

<div class="section-title">🔎 Seçilen Maç</div>

<div id="selectedMatch" class="status">
  Henüz maç seçilmedi.
</div>

<button onclick="analyzeMatch()" class="orange">
  🚀 ANALİZ ET
</button>

<div id="analysis"></div>

</div>

</div>

<script>

const API_URL = "https://v3.football.api-sports.io";

let selectedFixture = null;
let teamCache = {};
let matchCache = {};

document.addEventListener("DOMContentLoaded", () => {

  const saved = localStorage.getItem("iddaa_api_key");

  if(saved){
    document.getElementById("apiKey").value = saved;
    document.getElementById("apiStatus").innerHTML =
      '<span class="success">✓ API anahtarı kayıtlı.</span>';
  }

  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");

  document.getElementById("matchDate").value =
    `${yyyy}-${mm}-${dd}`;

});


function getKey(){

  return localStorage.getItem("iddaa_api_key") ||
         document.getElementById("apiKey").value.trim();

}


function saveKey(){

  const key = document.getElementById("apiKey").value.trim();

  if(!key){
    alert("API anahtarını gir.");
    return;
  }

  localStorage.setItem("iddaa_api_key",key);

  document.getElementById("apiStatus").innerHTML =
    '<span class="success">✓ API anahtarı kaydedildi.</span>';

}


async function api(endpoint){

  const key = getKey();

  if(!key){
    throw new Error("API anahtarı bulunamadı.");
  }

  const response = await fetch(API_URL + endpoint,{
    method:"GET",
    headers:{
      "x-apisports-key":key,
      "Accept":"application/json"
    }
  });

  if(!response.ok){
    throw new Error("HTTP " + response.status);
  }

  const data = await response.json();

  if(data.errors && Object.keys(data.errors).length){
    throw new Error(JSON.stringify(data.errors));
  }

  return data;
}


async function testApi(){

  const status = document.getElementById("apiStatus");

  status.innerHTML = "⏳ API test ediliyor...";

  try{

    const data = await api("/status");

    status.innerHTML =
      '<span class="success">✓ API bağlantısı başarılı.</span>';

  }catch(e){

    status.innerHTML =
      '<span class="error">✕ API bağlantısı başarısız: ' +
      escapeHtml(e.message) +
      '</span>';

  }

}


async function loadTeams(){

  const league =
    document.getElementById("league").value;

  const season =
    document.getElementById("season").value;

  const status =
    document.getElementById("matchStatus");

  status.innerHTML =
    "⏳ Takımlar yükleniyor...";

  try{

    const cacheKey =
      `teams_${league}_${season}`;

    let data;

    const cached =
      localStorage.getItem(cacheKey);

    if(cached){

      data = JSON.parse(cached);

    }else{

      data = await api(
        `/teams?league=${league}&season=${season}`
      );

      localStorage.setItem(
        cacheKey,
        JSON.stringify(data)
      );

    }

    const teams = data.response || [];

    if(!teams.length){
      throw new Error(
        "Bu lig/sezon için takım verisi bulunamadı."
      );
    }

    teamCache = {};

    const home =
      document.getElementById("homeTeam");

    const away =
      document.getElementById("awayTeam");

    home.innerHTML =
      '<option value="">Ev sahibi seç</option>';

    away.innerHTML =
      '<option value="">Deplasman seç</option>';

    teams.forEach(item => {

      teamCache[item.team.id] = item.team;

      const option1 =
        document.createElement("option");

      option1.value = item.team.id;
      option1.textContent = item.team.name;

      home.appendChild(option1);

      const option2 =
        document.createElement("option");

      option2.value = item.team.id;
      option2.textContent = item.team.name;

      away.appendChild(option2);

    });

    status.innerHTML =
      `<span class="success">✓ ${teams.length} takım yüklendi.</span>`;

  }catch(e){

    status.innerHTML =
      `<span class="error">✕ ${escapeHtml(e.message)}</span>`;

  }

}


async function leagueChanged(){

  document.getElementById("matches").innerHTML = "";

  document.getElementById("selectedMatch").innerHTML =
    "Henüz maç seçilmedi.";

  selectedFixture = null;

  await loadTeams();

}


async function loadMatches(){

  const league =
    document.getElementById("league").value;

  const season =
    document.getElementById("season").value;

  const date =
    document.getElementById("matchDate").value;

  const status =
    document.getElementById("matchStatus");

  if(!date){

    status.innerHTML =
      '<span class="error">Tarih seç.</span>';

    return;
  }

  status.innerHTML =
    "⏳ Gerçek maçlar getiriliyor...";

  document.getElementById("matches").innerHTML = "";

  try{

    const cacheKey =
      `fixtures_${league}_${season}_${date}`;

    let data;

    const cached =
      localStorage.getItem(cacheKey);

    if(cached){

      data = JSON.parse(cached);

    }else{

      data = await api(
        `/fixtures?league=${league}&season=${season}&date=${date}&timezone=Europe/Istanbul`
      );

      localStorage.setItem(
        cacheKey,
        JSON.stringify(data)
      );

    }

    const fixtures =
      data.response || [];

    status.innerHTML =
      `<span class="success">✓ ${fixtures.length} maç bulundu.</span>`;

    if(!fixtures.length){

      document.getElementById("matches").innerHTML =
        `<div class="status warning">
          Bu tarih için maç bulunamadı.
        </div>`;

      return;
    }

    fixtures.forEach(f => {

      const div =
        document.createElement("div");

      div.className = "match";

      const dateObj =
        new Date(f.fixture.date);

      const time =
        dateObj.toLocaleTimeString(
          "tr-TR",
          {
            hour:"2-digit",
            minute:"2-digit",
            timeZone:"Europe/Istanbul"
          }
        );

      let score = "";

      if(
        f.goals &&
        f.goals.home !== null &&
        f.goals.away !== null
      ){

        score =
          `<div class="score">
            Skor: ${f.goals.home} - ${f.goals.away}
          </div>`;

      }

      div.innerHTML = `

        <div class="team">
          ${escapeHtml(f.teams.home.name)}
          🆚
          ${escapeHtml(f.teams.away.name)}
        </div>

        <div class="small">
          ⏰ ${time}
          · ${escapeHtml(f.fixture.status.long || "")}
        </div>

        ${score}

        <button
          onclick="selectMatch(${f.fixture.id})">
          Bu Maçı Seç
        </button>

      `;

      document.getElementById("matches")
        .appendChild(div);

    });

  }catch(e){

    status.innerHTML =
      `<span class="error">
        ✕ ${escapeHtml(e.message)}
      </span>`;

  }

}


async function selectMatch(id){

  try{

    const data =
      await api(`/fixtures?id=${id}`);

    if(!data.response.length){

      alert("Maç bilgisi bulunamadı.");
      return;

    }

    const f =
      data.response[0];

    selectedFixture = f;

    document.getElementById("homeTeam").value =
      f.teams.home.id;

    document.getElementById("awayTeam").value =
      f.teams.away.id;

    document.getElementById("selectedMatch").innerHTML = `

      <div class="big">
        ${escapeHtml(f.teams.home.name)}
        🆚
        ${escapeHtml(f.teams.away.name)}
      </div>

      <div class="small">
        Fixture ID: ${f.fixture.id}
      </div>

    `;

    window.scrollTo({
      top:document.body.scrollHeight,
      behavior:"smooth"
    });

  }catch(e){

    alert("Maç seçilemedi: " + e.message);

  }

}


async function analyzeMatch(){

  if(!selectedFixture){

    const home =
      document.getElementById("homeTeam").value;

    const away =
      document.getElementById("awayTeam").value;

    if(!home || !away){

      alert("Önce bir maç seç.");
      return;

    }

    alert(
      "Analiz için gerçek bir fixture seçmen gerekiyor."
    );

    return;

  }

  const f =
    selectedFixture;

  const analysis =
    document.getElementById("analysis");

  analysis.innerHTML =
    `<div class="status">⏳ Analiz hazırlanıyor...</div>`;

  try{

    /*
      Aynı anda yalnızca gerekli verileri çekiyoruz.
      Bu API kotasını korumaya yardımcı olur.
    */

    const predictionPromise =
      api(`/predictions?fixture=${f.fixture.id}`);

    const h2hPromise =
      api(
        `/fixtures/headtohead?h2h=${f.teams.home.id}-${f.teams.away.id}&last=5`
      );

    const standingsPromise =
      api(
        `/standings?league=${f.league.id}&season=${f.league.season}`
      );

    const results =
      await Promise.allSettled([
        predictionPromise,
        h2hPromise,
        standingsPromise
      ]);

    const prediction =
      results[0].status === "fulfilled"
        ? results[0].value
        : null;

    const h2h =
      results[1].status === "fulfilled"
        ? results[1].value
        : null;

    const standings =
      results[2].status === "fulfilled"
        ? results[2].value
        : null;

    renderAnalysis(
      f,
      prediction,
      h2h,
      standings
    );

  }catch(e){

    analysis.innerHTML =
      `<div class="status error">
        Analiz hatası: ${escapeHtml(e.message)}
      </div>`;

  }

}


function renderAnalysis(
  fixture,
  predictionData,
  h2hData,
  standingsData
){

  let html = "";

  const p =
    predictionData &&
    predictionData.response &&
    predictionData.response[0]
      ? predictionData.response[0]
      : null;

  html += `

    <hr>

    <div class="section-title">
      📊 Maç Analizi
    </div>

    <div class="status">

      <b>
        ${escapeHtml(fixture.teams.home.name)}
        🆚
        ${escapeHtml(fixture.teams.away.name)}
      </b>

    </div>
  `;


  /*
    API-Football predictions endpoint
    home/draw/away probability bilgisi döndürebilir.
  */

  if(p && p.predictions){

    const pr = p.predictions;

    const percent =
      pr.percent || {};

    html += `

      <div class="prob">

        <div>
          <span>Ev</span>
          <b>${escapeHtml(percent.home || "-")}</b>
        </div>

        <div>
          <span>Beraberlik</span>
          <b>${escapeHtml(percent.draw || "-")}</b>
        </div>

        <div>
          <span>Deplasman</span>
          <b>${escapeHtml(percent.away || "-")}</b>
        </div>

      </div>
    `;

    html += `

      <div class="grid" style="margin-top:10px">

        <div class="stat">
          <div class="name">API Tahmini</div>
          <div class="value">
            ${escapeHtml(
              pr.winner && pr.winner.name
              ? pr.winner.name
              : "-"
            )}
          </div>
        </div>

        <div class="stat">
          <div class="name">Tahmini Skor</div>
          <div class="value">
            ${
              pr.goals &&
              pr.goals.home != null
              ? escapeHtml(pr.goals.home) +
                " - " +
                escapeHtml(pr.goals.away)
              : "-"
            }
          </div>
        </div>

      </div>
    `;

    if(pr.advice){

      html += `

        <div class="status" style="margin-top:10px">

          <b>API Tavsiyesi:</b><br>

          ${escapeHtml(pr.advice)}

        </div>
      `;

    }

  }else{

    html += `

      <div class="status warning">
        API tahmini bu maç için henüz mevcut değil.
      </div>
    `;

  }


  /*
    H2H
  */

  const h2hMatches =
    h2hData &&
    h2hData.response
      ? h2hData.response
      : [];

  html += `

    <hr>

    <div class="section-title">
      🤝 Son H2H
    </div>
  `;

  if(h2hMatches.length){

    h2hMatches.slice(0,5).forEach(m => {

      html += `

        <div class="match">

          <b>
            ${escapeHtml(m.teams.home.name)}
            ${m.goals.home}
            -
            ${m.goals.away}
            ${escapeHtml(m.teams.away.name)}
          </b>

          <div class="small">
            ${formatDate(m.fixture.date)}
          </div>

        </div>

      `;

    });

  }else{

    html += `
      <div class="status">
        H2H verisi bulunamadı.
      </div>
    `;

  }


  /*
    Puan durumu
  */

  html += `

    <hr>

    <div class="section-title">
      🏆 Puan Durumu
    </div>
  `;

  let rows = [];

  if(
    standingsData &&
    standingsData.response &&
    standingsData.response[0] &&
    standingsData.response[0].league &&
    standingsData.response[0].league.standings
  ){

    const groups =
      standingsData.response[0].league.standings;

    rows =
      groups.flat();

  }

  const homeId =
    fixture.teams.home.id;

  const awayId =
    fixture.teams.away.id;

  const selectedRows =
    rows.filter(x =>
      x.team &&
      (
        x.team.id === homeId ||
        x.team.id === awayId
      )
    );

  if(selectedRows.length){

    html += `<div class="grid">`;

    selectedRows.forEach(x => {

      html += `

        <div class="stat">

          <div class="name">
            ${escapeHtml(x.team.name)}
          </div>

          <div class="value">
            ${x.rank || "-"}.
          </div>

          <div class="small">
            ${x.points || 0} puan
            · ${x.all && x.all.played || 0} maç
          </div>

        </div>
      `;

    });

    html += `</div>`;

  }else{

    html += `
      <div class="status">
        Puan durumu bu maç için alınamadı.
      </div>
    `;

  }


  /*
    İstatistik notu
  */

  html += `

    <hr>

    <div class="status warning">

      ⚠️ Bu analiz istatistiksel veriye dayanır.
      Bahis sonucu garanti etmez.

      <br><br>

      İlk yarı sonucu, gol, KG ve korner yüzdelerini
      bir sonraki aşamada son maçların gerçek
      istatistiklerinden otomatik hesaplayacağız.

    </div>

  `;

  document.getElementById("analysis").innerHTML =
    html;

}


function formatDate(date){

  try{

    return new Date(date).toLocaleDateString(
      "tr-TR",
      {
        day:"2-digit",
        month:"2-digit",
        year:"numeric"
      }
    );

  }catch(e){

    return "-";

  }

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
