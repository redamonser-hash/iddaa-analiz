<script>

let allMatches = [];
let leagues = [];

function pad(n){
  return String(n).padStart(2,"0");
}

function formatDate(date){
  return date.getFullYear()+"-"+pad(date.getMonth()+1)+"-"+pad(date.getDate());
}

function getSelectedDate(){
  return document.getElementById("date").value;
}

function today(){
  const d = new Date();
  document.getElementById("date").value = formatDate(d);
  loadMatches();
}

function changeDay(amount){
  const input = document.getElementById("date");

  let d;

  if(input.value){
    d = new Date(input.value+"T12:00:00");
  }else{
    d = new Date();
  }

  d.setDate(d.getDate()+amount);

  input.value = formatDate(d);

  loadMatches();
}

function previousDay(){
  changeDay(-1);
}

function nextDay(){
  changeDay(1);
}

function escapeHtml(value){
  if(value === null || value === undefined) return "";

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function setStatus(text){
  document.getElementById("status").innerHTML = text;
}

function isObject(x){
  return x && typeof x === "object" && !Array.isArray(x);
}

function getTeamNames(match){

  let name =
    match.matchName ||
    match.name ||
    match.title ||
    match.match ||
    "";

  if(name){
    return splitMatchName(name);
  }

  const home =
    match.homeTeam?.name ||
    match.home?.name ||
    match.home?.teamName ||
    match.homeTeam ||
    match.home ||
    "";

  const away =
    match.awayTeam?.name ||
    match.away?.name ||
    match.away?.teamName ||
    match.awayTeam ||
    match.away ||
    "";

  return {
    home:String(home || ""),
    away:String(away || "")
  };
}

function splitMatchName(name){

  const separators = [
    " - ",
    "–",
    " vs ",
    " VS ",
    " v ",
    " V "
  ];

  for(const sep of separators){

    if(String(name).includes(sep)){

      const parts = String(name).split(sep);

      return {
        home:parts[0].trim(),
        away:parts.slice(1).join(sep).trim()
      };
    }
  }

  return {
    home:String(name),
    away:""
  };
}

function getScore(match){

  if(match.score){

    const home =
      match.score.home ??
      match.score.homeScore ??
      "";

    const away =
      match.score.away ??
      match.score.awayScore ??
      "";

    if(home !== "" || away !== ""){
      return {
        home,
        away
      };
    }
  }

  const home =
    match.homeScore ??
    match.scoreHome ??
    "";

  const away =
    match.awayScore ??
    match.scoreAway ??
    "";

  return {
    home,
    away
  };
}

function getTime(match){

  const value =
    match.mstUtc ??
    match.date ??
    match.matchDate ??
    match.startDate ??
    match.startTime ??
    "";

  if(!value) return "";

  let d;

  if(typeof value === "number"){
    d = new Date(value);
  }else{
    d = new Date(value);
  }

  if(isNaN(d.getTime())){

    const text = String(value);

    const found = text.match(/(\d{1,2}):(\d{2})/);

    if(found){
      return pad(found[1])+":"+found[2];
    }

    return text;
  }

  return d.toLocaleTimeString("tr-TR",{
    hour:"2-digit",
    minute:"2-digit",
    timeZone:"Europe/Istanbul"
  });
}

function getLeague(match){

  return (
    match.competition?.name ||
    match.competition?.title ||
    match.competitionName ||
    match.league?.name ||
    match.league?.title ||
    match.leagueName ||
    match.tournament?.name ||
    match.tournamentName ||
    "Diğer"
  );
}

function getIddaaCode(match){

  return (
    match.iddaaCode ??
    match.iddaa_code ??
    match.betCode ??
    ""
  );
}
