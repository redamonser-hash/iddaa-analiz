
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>İddaa Analiz Botu 26/27</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;
color:#e5e7eb;
}

header{
background:#020617;
padding:16px;
text-align:center;
font-size:22px;
font-weight:bold;
border-bottom:1px solid #334155;
}

.controls{
padding:12px;
display:flex;
gap:8px;
flex-wrap:wrap;
background:#111827;
}

button,
input,
select{
background:#1e293b;
color:white;
border:1px solid #475569;
border-radius:8px;
padding:10px;
}

button{
cursor:pointer;
}

input{
flex:1;
min-width:160px;
}

select{
min-width:160px;
}

.datebar{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
background:#172033;
}

.datebar button{
font-size:18px;
}

#dateText{
font-weight:bold;
}

.container{
padding:10px;
max-width:1000px;
margin:auto;
}

.status{
padding:10px;
margin-bottom:10px;
background:#1e293b;
border-radius:8px;
font-size:13px;
}

.card{
background:#111827;
border:1px solid #334155;
border-radius:12px;
margin-bottom:12px;
overflow:hidden;
}

.cardHead{
padding:14px;
background:#172033;
}

.match{
font-size:18px;
font-weight:bold;
text-align:center;
}

.league{
font-size:12px;
color:#94a3b8;
text-align:center;
margin-top:5px;
}

.score{
text-align:center;
font-size:24px;
font-weight:bold;
margin-top:8px;
}

.body{
padding:12px;
}

.section{
margin-top:12px;
border-top:1px solid #334155;
padding-top:10px;
}

.sectionTitle{
font-weight:bold;
margin-bottom:8px;
font-size:15px;
}

.market{
display:grid;
grid-template-columns:1fr 1fr;
gap:6px;
}

.option{
background:#1e293b;
padding:9px;
border-radius:7px;
display:flex;
justify-content:space-between;
gap:5px;
}

.option strong{
color:#facc15;
}

.best{
border:1px solid #22c55e;
background:#163322;
}

.analysis{
background:#020617;
border-radius:9px;
padding:12px;
margin-top:10px;
}

.prediction{
font-size:18px;
font-weight:bold;
text-align:center;
padding:12px;
background:#172033;
border-radius:8px;
margin-bottom:8px;
}

.small{
font-size:12px;
color:#94a3b8;
}

.tag{
display:inline-block;
padding:5px 8px;
border-radius:6px;
background:#334155;
margin:3px;
font-size:12px;
}

.green{
color:#4ade80;
}

.yellow{
color:#facc15;
}

.red{
color:#f87171;
}

.empty{
padding:30px;
text-align:center;
color:#94a3b8;
}

@media(max-width:600px){

header{
font-size:19px;
}

.match{
font-size:16px;
}

.market{
grid-template-columns:1fr;
}

.controls{
flex-direction:column;
}

input,
select,
button{
width:100%;
}

}

</style>
</head>

<body>

<header>
⚽ İddaa Analiz Botu 26/27
</header>

<div class="datebar">

<button onclick="changeDate(-1)">‹</button>

<div id="dateText"></div>

<button onclick="changeDate(1)">›</button>

</div>

<div class="controls">

<input
id="search"
placeholder="🔎 Takım ara..."
oninput="render()"
>

<select id="league" onchange="render()">
<option value="">🏆 Tüm Ligler</option>
</select>

<button onclick="loadData()">
🔄 Yenile
</button>

</div>

<div class="container">

<div id="status" class="status">
Veriler yükleniyor...
</div>

<div id="matches"></div>

</div>

<script>

var selectedDate = new Date();

var allMatches = [];
var competitions = {};
var allOdds = {};

var MONTHS = [
"Ocak",
"Şubat",
"Mart",
"Nisan",
"Mayıs",
"Haziran",
"Temmuz",
"Ağustos",
"Eylül",
"Ekim",
"Kasım",
"Aralık"
];

function pad(n){
return n < 10 ? "0" + n : "" + n;
}

function dateString(){

return selectedDate.getFullYear()
+ "-"
+ pad(selectedDate.getMonth()+1)
+ "-"
+ pad(selectedDate.getDate());

}

function prettyDate(){

return selectedDate.getDate()
+ " "
+ MONTHS[selectedDate.getMonth()]
+ " "
+ selectedDate.getFullYear();

}

function changeDate(days){

selectedDate.setDate(
selectedDate.getDate() + days
);

loadData();

}

document.getElementById("dateText").innerText =
prettyDate();


function loadData(){

document.getElementById("status").innerText =
"⏳ Veriler yükleniyor...";

var d = dateString();

var xhr = new XMLHttpRequest();

xhr.open(
"GET",
"data/" + d + ".json?t=" + Date.now(),
true
);

xhr.onreadystatechange = function(){

if(xhr.readyState !== 4) return;

if(xhr.status !== 200){

document.getElementById("status").innerText =
"⚠️ Bu tarih için maç verisi bulunamadı.";

allMatches = [];
render();

return;

}

try{

var json = JSON.parse(xhr.responseText);

allMatches =
json.data &&
json.data.matches
? json.data.matches
: [];

competitions = {};

if(
json.data &&
json.data.competitions
){

for(
var i=0;
i<json.data.competitions.length;
i++
){

var c = json.data.competitions[i];

competitions[c.id] =
c.name ||
c.competitionName ||
"Diğer";

}

}

loadOdds();

}
catch(e){

document.getElementById("status").innerText =
"❌ Maç verisi okunamadı.";

}

};

xhr.send();

}


function loadOdds(){

var d = dateString();

var xhr = new XMLHttpRequest();

xhr.open(
"GET",
"data/oranlar-" + d + ".json?t=" + Date.now(),
true
);

xhr.onreadystatechange = function(){

if(xhr.readyState !== 4) return;

if(xhr.status === 200){

try{

var json = JSON.parse(xhr.responseText);

allOdds =
json.odds ||
{};

}
catch(e){

allOdds = {};

}

}
else{

allOdds = {};

}

fillLeagues();

render();

};

xhr.send();

}


function fillLeagues(){

var select =
document.getElementById("league");

var old = select.value;

var leagues = {};

for(
var i=0;
i<allMatches.length;
i++
){

var m = allMatches[i];

var id = m.competitionId;

if(id){

leagues[id] =
competitions[id] ||
"Diğer";

}

}

select.innerHTML =
'<option value="">🏆 Tüm Ligler</option>';

for(
var key in leagues
){

var option =
document.createElement("option");

option.value = key;
option.textContent =
leagues[key];

select.appendChild(option);

}

select.value = old;

document.getElementById("status").innerText =
"✅ "
+ allMatches.length
+ " maç bulundu • "
+ prettyDate();

}


function getOdds(match){

if(!match) return [];

var id =
String(match.id);

return allOdds[id]
|| allOdds[match.id]
|| [];

}


function cleanName(name){

if(!name) return "";

return String(name)
.toLowerCase()
.replace(/ı/g,"i")
.replace(/ş/g,"s")
.replace(/ğ/g,"g")
.replace(/ü/g,"u")
.replace(/ö/g,"o")
.replace(/ç/g,"c")
.trim();

}


function findMarket(odds,names){

if(!odds || !odds.length)
return null;

var wanted = [];

for(
var i=0;
i<names.length;
i++
){

wanted.push(
cleanName(names[i])
);

}

for(
var i=0;
i<odds.length;
i++
){

var title =
cleanName(
odds[i].market ||
odds[i].name ||
odds[i].baslik ||
odds[i].title ||
""
);

for(
var j=0;
j<wanted.length;
j++
){

if(
title.indexOf(wanted[j]) !== -1
){

return odds[i];

}

}

}

return null;

}


function getOptions(market){

if(!market) return [];

var list =
market.options ||
market.secenekler ||
market.secenek ||
market.values ||
market.items ||
[];

if(!Array.isArray(list))
return [];

var result = [];

for(
var i=0;
i<list.length;
i++
){

var item = list[i];

if(!item) continue;

var name =
item.secenek ||
item.name ||
item.key ||
item.label ||
item.option ||
"";

var odd =
item.oran ||
item.odd ||
item.value ||
item.price ||
"";

if(name === "") continue;

var num =
parseFloat(
String(odd)
.replace(",", ".")
);

result.push({
name:name,
odd:num
});

}

return result;

}


function uniqueOptions(list){

var result = [];
var seen = {};

for(
var i=0;
i<list.length;
i++
){

var key =
list[i].name
+ "_"
+ list[i].odd;

if(!seen[key]){

seen[key] = true;

result.push(
list[i]
);

}

}

return result;

}


function probability(list){

var valid = [];

for(
var i=0;
i<list.length;
i++
){

if(
list[i].odd &&
list[i].odd > 1
){

valid.push(list[i]);

}

}

if(!valid.length)
return [];

var total = 0;

for(
var i=0;
i<valid.length;
i++
){

total +=
1 / valid[i].odd;

}

var result = [];

for(
var i=0;
i<valid.length;
i++
){

result.push({

name:valid[i].name,

odd:valid[i].odd,

prob:
(1 / valid[i].odd)
/
total
* 100

});

}

return result;

}


function bestOption(list){

if(!list || !list.length)
return null;

var best = list[0];

for(
var i=1;
i<list.length;
i++
){

if(
list[i].prob >
best.prob
){

best = list[i];

}

}

return best;

}


function marketHtml(title,list){

if(!list || !list.length)
return "";

var probs =
probability(
uniqueOptions(list)
);

if(!probs.length)
return "";

var html = "";

html +=
'<div class="section">';

html +=
'<div class="sectionTitle">'
+ title
+ '</div>';

html +=
'<div class="market">';

for(
var i=0;
i<probs.length;
i++
){

var p = probs[i];

var cls =
p.prob >= 50
? "option best"
: "option";

html +=
'<div class="' + cls + '">';

html +=
'<span>'
+ p.name
+ '</span>';

html +=
'<strong>'
+ p.odd.toFixed(2)
+ ' • '
+ p.prob.toFixed(0)
+ '%'
+ '</strong>';

html +=
'</div>';

}

html += "</div></div>";

return html;

}


function getTeamGoalProbability(
odds,
teamPrefix,
threshold
){

var market =
findMarket(
odds,
[
teamPrefix
+ " "
+ threshold
+ " Alt/Üst"
]
);

if(!market)
return null;

var probs =
probability(
getOptions(market)
);

for(
var i=0;
i<probs.length;
i++
){

if(
cleanName(probs[i].name)
.indexOf("ust") !== -1
){

return probs[i].prob / 100;

}

}

return null;

}


function expectedGoals(
odds,
teamPrefix
){

var p05 =
getTeamGoalProbability(
odds,
teamPrefix,
"0,5"
);

var p15 =
getTeamGoalProbability(
odds,
teamPrefix,
"1,5"
);

var p25 =
getTeamGoalProbability(
odds,
teamPrefix,
"2,5"
);

var sum = 0;

var count = 0;

if(p05 !== null){

sum += p05;
count++;

}

if(p15 !== null){

sum += p15;
count++;

}

if(p25 !== null){

sum += p25;
count++;

}

if(!count)
return null;

/*
Yaklaşık beklenen gol:

P(G>=1)
+
P(G>=2)
+
P(G>=3)

Bu değer oranlardan yaklaşık
gol beklentisi çıkarmak için kullanılıyor.
*/

return sum;

}


function poisson(lambda,k){

var factorial = 1;

for(
var i=2;
i<=k;
i++
){

factorial *= i;

}

return Math.exp(-lambda)
*
Math.pow(lambda,k)
/
factorial;

}


function predictedScore(
homeLambda,
awayLambda
){

if(
homeLambda === null ||
awayLambda === null
){

return null;

}

var best = null;

for(
var h=0;
h<=5;
h++
){

for(
var a=0;
a<=5;
a++
){

var p =
poisson(homeLambda,h)
*
poisson(awayLambda,a);

if(
!best ||
p > best.prob
){

best = {

home:h,

away:a,

prob:p

};

}

}

}

return best;

}


function makeAnalysis(
match,
odds
){

var home =
match.homeTeam ||
match.home ||
"Ev Sahibi";

var away =
match.awayTeam ||
match.away ||
"Deplasman";

var homeName =
typeof home === "string"
? home
: home.name || "Ev Sahibi";

var awayName =
typeof away === "string"
? away
: away.name || "Deplasman";


/* MAÇ SONUCU */

var resultMarket =
findMarket(
odds,
["Maç Sonucu"]
);


/* 2.5 */

var over25 =
findMarket(
odds,
[
"2,5 Alt/Üst",
"2.5 Alt/Üst"
]
);


/* 3.5 */

var over35 =
findMarket(
odds,
[
"3,5 Alt/Üst",
"3.5 Alt/Üst",
"MS ve 3,5 Alt/Üst"
]
);


/* KORNER */

var corners =
findMarket(
odds,
[
"Toplam Korner Aralığı"
]
);


/* EN ÇOK KORNER */

var mostCorners =
findMarket(
odds,
[
"En Çok Korner"
]
);


/* BEKLENEN GOL */

var homeXg =
expectedGoals(
odds,
"Ev Sahibi"
);

var awayXg =
expectedGoals(
odds,
"Deplasman"
);


/*
Skor tahmini
*/

var score =
predictedScore(
homeXg,
awayXg
);


var html = "";


/* TAHMİN */

if(score){

html +=
'<div class="analysis">';

html +=
'<div class="prediction">'
+ "🎯 Tahmini Skor: "
+ homeName
+ " "
+ score.home
+ " - "
+ score.away
+ " "
+ awayName
+ '</div>';

html +=
'<div class="small" style="text-align:center">'
+
"Oran bazlı matematiksel tahmindir • kesin sonuç değildir"
+
'</div>';

html += "</div>";

}


/* 1-X-2 */

html += marketHtml(
"🏆 Maç Sonucu 1-X-2",
getOptions(resultMarket)
);


/* 2.5 */

html += marketHtml(
"⚽ 2,5 Alt / Üst",
getOptions(over25)
);


/* 3.5 */

html += marketHtml(
"🔥 3,5 Alt / Üst",
getOptions(over35)
);


/* KORNER */

html += marketHtml(
"🚩 Toplam Korner",
getOptions(corners)
);


/* EN ÇOK KORNER */

html += marketHtml(
"🚩 En Çok Korner",
getOptions(mostCorners)
);


/* ÖZET */

var summary = [];

if(resultMarket){

var r =
bestOption(
probability(
getOptions(resultMarket)
)
);

if(r){

summary.push(
"1-X-2: "
+ r.name
+ " (%"
+ r.prob.toFixed(0)
+ ")"
);

}

}

if(over25){

var r =
bestOption(
probability(
getOptions(over25)
)
);

if(r){

summary.push(
"2.5: "
+ r.name
+ " (%"
+ r.prob.toFixed(0)
+ ")"
);

}

}

if(over35){

var r =
bestOption(
probability(
getOptions(over35)
)
);

if(r){

summary.push(
"3.5: "
+ r.name
+ " (%"
+ r.prob.toFixed(0)
+ ")"
);

}

}

if(corners){

var r =
bestOption(
probability(
getOptions(corners)
)
);

if(r){

summary.push(
"Korner: "
+ r.name
+ " (%"
+ r.prob.toFixed(0)
+ ")"
);

}

}

if(summary.length){

html +=
'<div class="analysis">';

html +=
'<div class="sectionTitle">'
+ "📊 Analiz Özeti"
+ '</div>';

for(
var i=0;
i<summary.length;
i++
){

html +=
'<div class="tag">'
+ summary[i]
+ '</div>';

}

html += "</div>";

}


return html;

}


function getMatchTime(match){

var utc =
match.mstUtc ||
match.startTime ||
match.date ||
"";

if(!utc)
return "";

try{

var d =
new Date(utc);

if(!isNaN(d.getTime())){

return pad(d.getHours())
+ ":"
+ pad(d.getMinutes());

}

}
catch(e){}

return "";

}


function getScore(match){

var score = "";

if(
match.homeScore !== undefined &&
match.awayScore !== undefined
){

score =
match.homeScore
+ " - "
+ match.awayScore;

}

else if(
match.score
){

score =
match.score;

}

return score;

}


function render(){

var box =
document.getElementById("matches");

var search =
cleanName(
document.getElementById("search").value
);

var league =
document.getElementById("league").value;

box.innerHTML = "";

var count = 0;

for(
var i=0;
i<allMatches.length;
i++
){

var m =
allMatches[i];

var home =
m.homeTeam ||
m.home ||
"";

var away =
m.awayTeam ||
m.away ||
"";

var homeName =
typeof home === "string"
? home
: home.name || "";

var awayName =
typeof away === "string"
? away
: away.name || "";


/* ARAMA */

var text =
cleanName(
homeName
+ " "
+ awayName
);

if(
search &&
text.indexOf(search) === -1
){

continue;

}


/* LİG */

if(
league &&
String(m.competitionId)
!== String(league)
){

continue;

}

count++;


var leagueName =
competitions[m.competitionId]
||
m.competitionName
||
"Diğer";


var odds =
getOdds(m);


var html =
'<div class="card">';


/* BAŞLIK */

html +=
'<div class="cardHead">';

html +=
'<div class="match">'
+ homeName
+ " - "
+ awayName
+ '</div>';

html +=
'<div class="league">'
+ leagueName
+ " • "
+ getMatchTime(m)
+ '</div>';

var scoreText =
getScore(m);

if(scoreText){

html +=
'<div class="score">'
+ scoreText
+ '</div>';

}

html +=
'</div>';


/* ANALİZ */

html +=
'<div class="body">';

if(odds && odds.length){

html +=
makeAnalysis(
m,
odds
);

}
else{

html +=
'<div class="empty">'
+
"Bu maç için oran verisi henüz yok."
+
'</div>';

}


/* İDDAA KODU */

if(m.iddaaCode){

html +=
'<div class="section">'
+
'<span class="small">İddaa Kodu:</span> '
+
'<strong>'
+
m.iddaaCode
+
'</strong>'
+
'</div>';

}

html +=
'</div>';

html +=
'</div>';

box.innerHTML += html;

}


if(count === 0){

box.innerHTML =
'<div class="empty">'
+
"🔎 Bu kriterlere uygun maç bulunamadı."
+
'</div>';

}

}


loadData();

</script>

</body>
</html>
