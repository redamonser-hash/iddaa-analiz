<script>

var selectedDate = new Date();

var allMatches = [];
var competitions = {};
var allOdds = {};

var MONTHS = [
"Ocak",
"Şubat",
"Mart",
"Nisan",
"Mayıs",
"Haziran",
"Temmuz",
"Ağustos",
"Eylül",
"Ekim",

"Aralık"
];


/* =========================
   TARİH
========================= */

function pad(n){

return n < 10
? "0" + n
: "" + n;

}


function dateString(){

return selectedDate.getFullYear()
+ "-"
+ pad(selectedDate.getMonth()+1)
+ "-"
+ pad(selectedDate.getDate());

}


function prettyDate(){

return selectedDate.getDate()
+ " "
+ MONTHS[selectedDate.getMonth()]
+ " "
+ selectedDate.getFullYear();

}


function changeDate(days){

selectedDate.setDate(
selectedDate.getDate() + days
);

document.getElementById("dateText").innerText =
prettyDate();

loadData();

}


document.getElementById("dateText").innerText =
prettyDate();


/* =========================
   VERİ YÜKLEME
========================= */

function loadData(){

document.getElementById("status").innerText =
"⏳ Maçlar yükleniyor...";

document.getElementById("matches").innerHTML =
'<div class="loading">⏳ Veriler hazırlanıyor...</div>';

var d = dateString();

var xhr = new XMLHttpRequest();

xhr.open(
"GET",
"data/" + d + ".json?t=" + Date.now(),
true
);

xhr.onreadystatechange = function(){

if(xhr.readyState !== 4){

return;

}

if(xhr.status !== 200){

allMatches = [];
competitions = {};

document.getElementById("status").innerText =
"⚠️ Bu tarih için maç verisi bulunamadı.";

document.getElementById("matches").innerHTML =
'<div class="empty">'
+
"Bu tarihte veri bulunamadı."
+
'</div>';

return;

}

try{

var json =
JSON.parse(xhr.responseText);


/*
================================
MAÇLARI DÜZELT
================================
*/

allMatches = normalizeMatches(
json.data
? json.data.matches
: null
);


/*
================================
LİGLERİ DÜZELT
================================
*/

competitions = normalizeCompetitions(
json.data
? json.data.competitions
: null
);


loadOdds();

}

catch(e){

console.log(e);

allMatches = [];
competitions = {};

document.getElementById("status").innerText =
"❌ JSON verisi okunamadı.";

document.getElementById("matches").innerHTML =
'<div class="empty">'
+
"Veri okunurken hata oluştu."
+
'</div>';

}

};

xhr.send();

}


/* =========================
   MAÇ VERİSİNİ ARRAY YAP
========================= */

function normalizeMatches(data){

var result = [];

if(!data){

return result;

}


/*
Zaten array ise
*/

if(Array.isArray(data)){

return data;

}


/*
Obje ise
*/

if(typeof data === "object"){

for(var key in data){

if(
data.hasOwnProperty(key)
){

var item = data[key];


/*
Bazı yapılarda kayıt
array içinde olabilir
*/

if(Array.isArray(item)){

for(
var j=0;
j<item.length;
j++
){

if(item[j]){

result.push(
item[j]
);

}

}

}
else if(item){

/*
İçinde matches varsa
*/

if(
item.matches &&
Array.isArray(item.matches)
){

for(
var k=0;
k<item.matches.length;
k++
){

if(item.matches[k]){

result.push(
item.matches[k]
);

}

}

}
else{

result.push(item);

}

}

}

}

}

return result;

}


/* =========================
   LİG VERİSİNİ NORMALLEŞTİR
========================= */

function normalizeCompetitions(data){

var result = {};

if(!data){

return result;

}


/*
Array
*/

if(Array.isArray(data)){

for(
var i=0;
i<data.length;
i++
){

var c = data[i];

if(!c) continue;

var id =
c.id ||
c.competitionId;

if(id){

result[id] =
c.name ||
c.competitionName ||
c.title ||
"Diğer";

}

}

return result;

}


/*
Object
*/

if(typeof data === "object"){

for(var key in data){

if(
!data.hasOwnProperty(key)
){

continue;

}

var c = data[key];

if(!c){

continue;

}

if(typeof c === "string"){

result[key] = c;

}
else{

result[key] =
c.name ||
c.competitionName ||
c.title ||
"Diğer";

}

}

}

return result;

}


/* =========================
   ORANLAR
========================= */

function loadOdds(){

var d = dateString();

var xhr = new XMLHttpRequest();

xhr.open(
"GET",
"data/oranlar-" + d + ".json?t=" + Date.now(),
true
);

xhr.onreadystatechange = function(){

if(xhr.readyState !== 4){

return;

}

allOdds = {};


if(xhr.status === 200){

try{

var json =
JSON.parse(xhr.responseText);

if(json){

allOdds =
json.odds ||
json.data ||
{};

}

}
catch(e){

allOdds = {};

}

}


fillLeagues();

render();

};


xhr.send();

}


/* =========================
   LİG FİLTRESİ
========================= */

function fillLeagues(){

var select =
document.getElementById("league");

var old =
select.value;

var leagues = {};


for(
var i=0;
i<allMatches.length;
i++
){

var m =
allMatches[i];

if(!m){

continue;

}

var id =
m.competitionId ||
m.competitionID ||
m.leagueId;

if(id){

leagues[id] =
competitions[id] ||
m.competitionName ||
"Diğer";

}

}


select.innerHTML =
'<option value="">🏆 Tüm Ligler</option>';


for(
var key in leagues
){

if(
!leagues.hasOwnProperty(key)
){

continue;

}

var option =
document.createElement("option");

option.value = key;

option.textContent =
leagues[key];

select.appendChild(option);

}


select.value = old;


document.getElementById("status").innerText =
"✅ "
+ allMatches.length
+ " maç bulundu • "
+ prettyDate();

}


/* =========================
   ORAN BUL
========================= */

}

var id =
String(

match.matchId ||
match.eventId ||
""
);


/*
En yaygın yapı:
{
  "12345": [...]
}
*/

if(
allOdds &&
allOdds[id]
){

);

}


/*
Sayısal key
*/

if(
allOdds &&
allOdds[match.id]
){

return normalizeOdds(
allOdds[match.id]

}


/*
Bazı JSON yapılarda
matches dizisi olabilir
*/

if(

){

for(
var i=0;
i<allOdds.length;
i++
){

var item =
allOdds[i];

if(!item){

continue;

}

var itemId =
String(
item.matchId ||
item.id ||
item.eventId ||
""
);

if(
itemId === id
){

return normalizeOdds(
item.odds ||

/* =========================
   ORANLARI NORMALLEŞTİR
========================= */

function normalizeOdds(data){

if(!data){

return [];

}


/*
Array ise
*/

if(Array.isArray(data)){

return data;

}


/*
Object market yapısı
*/

if(typeof data === "object"){

var result = [];

for(var key in data){

if(
!data.hasOwnProperty(key)
){

continue;

}

var item =
data[key];

if(!item){

continue;

}


/*
Zaten market objesi
*/

if(
item.market ||
item.name ||
item.title ||
item.baslik
){

result.push(item);

}
else if(
Array.isArray(item)
){

result.push({

market:key,

options:item

});

}
else if(
item.options ||
item.secenekler ||
item.values ||
item.items
){

result.push({

market:key,

options:
item.options ||
item.secenekler ||
item.values ||
item.items

});

}

}

return result;

}


return [];

}


/* =========================
   TEMİZ METİN
========================= */

function cleanName(name){

if(!name){

return "";

}

return String(name)
.toLowerCase()
.replace(/ı/g,"i")
.replace(/ş/g,"s")
.replace(/ğ/g,"g")
.replace(/ü/g,"u")
.replace(/ö/g,"o")
.replace(/ç/g,"c")
.trim();

}


/* =========================
   MARKET BUL
========================= */

function findMarket(
odds,
names
){

if(
!odds ||
!odds.length
){

return null;

}


var wanted = [];


for(
var i=0;
i<names.length;
i++
){

wanted.push(
cleanName(names[i])
);

}


for(
var i=0;
i<odds.length;
i++
){

var title =
cleanName(
odds[i].market ||
odds[i].name ||
odds[i].baslik ||
odds[i].title ||
odds[i].marketName ||
""
);


for(
var j=0;
j<wanted.length;
j++
){

if(
title.indexOf(wanted[j]) !== -1
){

return odds[i];

}

}

}


return null;

}


/* =========================
   SEÇENEKLERİ AL
========================= */

function getOptions(market){

if(!market){

return [];

}


var list =
market.options ||
market.secenekler ||
market.secenek ||
market.values ||
market.items ||
[];


if(!Array.isArray(list)){

return [];

}


var result = [];


for(
var i=0;
i<list.length;
i++
){

var item =
list[i];


if(!item){

continue;

}


var name =
item.secenek ||
item.name ||
item.key ||
item.label ||
item.option ||
item.selection ||
"";


var odd =
item.oran ||
item.odd ||
item.value ||
item.price ||
item.odds ||
"";


if(
name === ""
){

continue;

}


var num =
parseFloat(
String(odd)
.replace(",",".")
);


if(
isNaN(num)
){

continue;

}


if(num <= 1){

continue;

}


result.push({

name:name,

odd:num

});

}


return result;

}


/* =========================
   TEKRARLARI SİL
========================= */

function uniqueOptions(list){

var result = [];

var seen = {};


for(
var i=0;
i<list.length;
i++
){

var key =
cleanName(list[i].name)
+ "_"
+ list[i].odd;


if(!seen[key]){

seen[key] = true;

result.push(
list[i]
);

}

}


return result;

}


/* =========================
   OLASILIK
========================= */

function probability(list){

var valid = [];


for(
var i=0;
i<list.length;
i++
){

if(
list[i].odd &&
list[i].odd > 1
){

valid.push(
list[i]
);

}

}


if(!valid.length){

return [];

}


var total = 0;


for(
var i=0;
i<valid.length;
i++
){

total +=
1 / valid[i].odd;

}


var result = [];


for(
var i=0;
i<valid.length;
i++
){

result.push({

name:
valid[i].name,

odd:
valid[i].odd,

prob:
(
(1 / valid[i].odd)
/
total
) * 100

});

}


return result;

}


/* =========================
   EN YÜKSEK
========================= */

function bestOption(list){

if(
!list ||
!list.length
){

return null;

}


var best =
list[0];


for(
var i=1;
i<list.length;
i++
){

if(
list[i].prob >
best.prob
){

best =
list[i];

}

}


return best;

}

========================= */

function marketHtml(

list

!list ||
!list.length

}


var probs =
probability(
uniqueOptions(list)
);

'</div>';

i<probs.length;

+

+
p.odd.toFixed(2)
+
" • "
+
p.prob.toFixed(0)
+
"%"
+
'</strong>';


html +=
'</div>';

}


html +=
'</div>';


html +=
'</div>';


return html;

}


/* =========================
   TAKIM GOL OLASILIĞI
========================= */

function getTeamGoalProbability(
odds,
teamPrefix,
threshold
){

var market =
findMarket(
odds,
[
teamPrefix
+ " "
+ threshold
+ " Alt/Üst",

teamPrefix
+ " "
+ threshold
+ " Altı/Üstü",

teamPrefix
+ " "
+ threshold
+ " Alt / Üst"
]
);


if(!market){

return null;

}


var probs =
probability(
getOptions(market)
);


for(
var i=0;
i<probs.length;
i++
){

var name =
cleanName(
probs[i].name
);


if(
name.indexOf("ust") !== -1
){

return probs[i].prob / 100;

}

}


return null;

}


/* =========================
   BEKLENEN GOL
========================= */

function expectedGoals(
odds,
teamPrefix
){

var p05 =
getTeamGoalProbability(
odds,
teamPrefix,
"0,5"
);


var p15 =
getTeamGoalProbability(
odds,
teamPrefix,
"1,5"
);


var p25 =
getTeamGoalProbability(
odds,
teamPrefix,
"2,5"
);


var sum = 0;


if(p05 !== null){

sum += p05;

}


if(p15 !== null){

sum += p15;

}


if(p25 !== null){

sum += p25;

}


if(
p05 === null &&
p15 === null &&
p25 === null
){

return null;

}


/*
Oranlardan yaklaşık
beklenen gol.
*/

if(sum < 0.15){

sum = 0.15;

}

if(sum > 3.5){

sum = 3.5;

}


return sum;

}


/* =========================
   POISSON
========================= */

function poisson(
lambda,
k
){

var factorial = 1;


for(
var i=2;
i<=k;
i++
){

factorial *= i;

}


return Math.exp(-lambda)
*
Math.pow(lambda,k)
/
factorial;

}


/* =========================
   TAHMİNİ SKOR
========================= */

function predictedScore(
homeLambda,
awayLambda
){

if(
homeLambda === null ||
awayLambda === null
){

return null;

}


var best = null;


for(
var h=0;
h<=5;
h++
){

for(
var a=0;
a<=5;
a++
){

var p =
poisson(homeLambda,h)
*
poisson(awayLambda,a);


if(
!best ||
p > best.prob
){

best = {

home:h,

away:a,

prob:p

};

}

}

}


return best;

}

/* =========================
   SAAT
========================= */

function getMatchTime(match){

var utc =
match.mstUtc ||
match.startTime ||
match.date ||
match.matchDate ||
"";


if(!utc){

return "";

}


try{

var d =
new Date(utc);


if(
!isNaN(
d.getTime()
)
){

return pad(d.getHours())
+
":"
+
pad(d.getMinutes());

}

}
catch(e){}


return "";

}


/* =========================
   SKOR
========================= */

function getScore(match){

if(
match.homeScore !== undefined &&
match.awayScore !== undefined
){

return (
match.homeScore
+
" - "
+
match.awayScore
);

}


if(
match.score !== undefined &&
match.score !== null
){

if(
typeof match.score === "string"
){

return match.score;

}

if(
typeof match.score === "object"
){

var hs =
match.score.home ||
match.score.homeScore ||
"";


var as =
match.score.away ||
match.score.awayScore ||
"";


if(
hs !== "" ||
as !== ""
){

return hs
+
" - "
+
as;

}

}

}


return "";

}
