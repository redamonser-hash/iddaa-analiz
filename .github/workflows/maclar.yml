name: Mackolik Mac Verileri

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

jobs:
  maclari-getir:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Mac verilerini cek
        run: |
          mkdir -p data

          for i in 0 1 2 3 4 5 6 7
          do
            TAR=$(date -u -d "+$i day" +"%Y-%m-%d")
            DOSYA="$TAR.json"

            echo "Cekiliyor: $TAR"

            curl -L --retry 3 \
              -A "Mozilla/5.0" \
              -H "Accept: application/json" \
              "https://www.mackolik.com/perform/p0/ajax/components/competition/livescores/json?sports%5B%5D=Soccer&matchDate=$TAR" \
              -o "data/$DOSYA"

            if ! jq empty "data/$DOSYA" 2>/dev/null; then
              echo "Gecersiz JSON geldi: $TAR"
              echo '{"data":{"matches":{}}}' > "data/$DOSYA"
            fi

            echo "Dosya hazir: data/$DOSYA"
          done

      - name: Degisiklikleri kaydet
        run: |
          git config user.name "iddaa-analiz-bot"
          git config user.email "actions@github.com"

          git add data/

          git diff --cached --quiet || \
          git commit -m "Mackolik mac verilerini guncelle"

          git push
